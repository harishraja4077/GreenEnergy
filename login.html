<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenVolt Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<body class="login-page">

<div class="login-wrapper">

    <div class="login-left">

        <div class="brand">
            <img src="images/green_logo.webp" alt="GreenVolt">
            
        </div>

        <span class="badge">⚡ Clean Energy. Better Future.</span>

        <h2>
            Powering a
            <span>Sustainable</span>
            Tomorrow
        </h2>

        <p>
            Access your GreenVolt dashboard and monitor renewable
            energy solutions in real-time.
        </p>

        <div class="stats">

            <div>
                <h3>100%</h3>
                <span>Clean Energy</span>
            </div>

            <div>
                <h3>500+</h3>
                <span>Projects</span>
            </div>

            <div>
                <h3>25K+</h3>
                <span>Clients</span>
            </div>

        </div>

    </div>

    <div class="login-right">

        <div class="login-card">

            <img src="images/green_logo.webp" class="login-logo">

            <h2>Welcome Back</h2>
            <p>Sign in to continue</p>

            <form id="loginForm">

                <input type="email"
                       placeholder="Email Address"
                       required>

                <input type="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Login
                </button>

            </form>

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
e.preventDefault();
window.location.href="dashboard.html";
});
</script>

</body>

</body>
</html>
