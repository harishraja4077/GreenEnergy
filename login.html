<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenVolt Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <body class="login-page">

        <div class="login-wrapper">

            <div class="login-left animate-slide-in-left">

                <div class="brand animate-fade-in-up delay-100">
                    <a href="index.html"><img src="images/green_logo.webp" alt="GreenVolt"></a>

                </div>

                <span class="badge">⚡ Clean Energy. Better Future.</span>

                <h2 class="animate-fade-in-up delay-200">
                    Powering a
                    <span>Sustainable</span>
                    Tomorrow
                </h2>

                <p class="animate-fade-in-up delay-300">
                    Access your GreenVolt dashboard and monitor renewable
                    energy solutions in real-time.
                </p>



            </div>

            <div class="login-right">

                <div class="login-card hover-lift animate-scale-in delay-200">
                    <a href="index.html"><img src="images/green_logo.webp" class="login-logo"></a>

                    <h2>Welcome Back</h2>
                    <p>Sign in to continue</p>

                    <form id="loginForm">

                        <div class="input-group" style="margin-bottom: 20px;">
                            <label for="authLevel"
                                style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; color: #555;">Access
                                Corridor</label>
                            <select id="authLevel" required>
                                <option value="" disabled selected>Choose authorization level...</option>
                                <option value="client">Client</option>
                                <option value="worker">Worker</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>

                        <div class="input-group" style="margin-bottom: 20px;">
                            <label for="email"
                                style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; color: #555;">Identity
                                Token</label>
                            <input type="email" id="email" placeholder="yourname@gmail.com" required>
                        </div>

                        <div class="input-group" style="margin-bottom: 20px;">
                            <label for="password"
                                style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; color: #555;">Encryption
                                Key</label>
                            <input type="password" id="password" placeholder="**************" required>
                        </div>

                        <div class="form-options">

                            <a href="login.html" class="forgot-pwd">Forgot Password</a>
                        </div>

                        <button type="submit" class="btn-login-submit">
                            Initiate Authorization
                        </button>

                        <div class="social-login">
                            <p>Or continue with</p>
                            <div class="social-icons">
                                <a href="404.html" class="social-btn">G</a>
                                <a href="404.html" class="social-btn">in</a>
                            </div>
                        </div>

                    </form>

                    <a href="index.html">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

        <script>
            document.getElementById("loginForm").addEventListener("submit", function (e) {

                e.preventDefault();

                const email = document.getElementById("email").value;
                const authLevelSelect = document.getElementById("authLevel");
                const authLevel = authLevelSelect.options[authLevelSelect.selectedIndex].text;

                localStorage.setItem("loggedInUser", email);
                localStorage.setItem("authLevel", authLevel);

                window.location.href = "dashboard.html";

            });
        </script>

    </body>

</body>

</html>
