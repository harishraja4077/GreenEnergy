<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenVolt Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-left animate-slide-in-left">

            <div class="brand animate-fade-in-up delay-100">
                <a href="index.html"><img src="images/green_logo.webp" alt="GreenVolt"></a>
            </div>

            <span class="badge">⚡ Clean Energy Access Portal.</span>

            <h2 class="animate-fade-in-up delay-200">
                Join the
                <span>Grid</span>
                Network
            </h2>

            <p class="animate-fade-in-up delay-300">
                Register your operator node to connect and start monitoring renewable energy solutions across the smart grid.
            </p>

        </div>

        <div class="login-right">

            <div class="login-card hover-lift animate-scale-in delay-200">
                <a href="index.html"><img src="images/green_logo.webp" class="login-logo"></a>

                <h2>Register Grid Node</h2>
                <p>Initialize your clean energy storage connection</p>

                <form id="signupForm">

                    <div class="input-group" style="margin-bottom: 20px;">
                        <label for="name"
                            style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; color: #555;">Operator Name</label>
                        <input type="text" id="name" placeholder="e.g. Alexis Carter" required>
                    </div>

                    <div class="input-group" style="margin-bottom: 20px;">
                        <label for="authLevel"
                            style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; color: #555;">System Role</label>
                        <select id="authLevel" required>
                            <option value="" disabled selected hidden>Select Role...</option>
                            <option value="user">User / Consumer Node</option>
                            <option value="admin">Admin / Grid Operator</option>
                        </select>
                    </div>

                    <div class="input-group" style="margin-bottom: 20px;">
                        <label for="email"
                            style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; color: #555;">Operational Email</label>
                        <input type="email" id="email" placeholder="yourname@stackly.io" required>
                    </div>

                    <div class="input-group" style="margin-bottom: 20px;">
                        <label for="password"
                            style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; color: #555;">Establish Security Key</label>
                        <input type="password" id="password" placeholder="**************" required>
                    </div>

                    <button type="submit" class="btn-login-submit">
                        Establish Connection
                    </button>

                    <div class="social-login">
                        <p>Or authenticate with</p>
                        <div class="social-icons">
                            <a href="404.html" class="social-btn">G</a>
                            <a href="404.html" class="social-btn">in</a>
                        </div>
                    </div>

                </form>

                <div style="margin-top: 20px; text-align: center;">
                    <a href="login.html" style="font-size: 14px; color: #555; text-decoration: none; font-weight: 600; display: inline-block;">
                        ← Already have an account? Login
                    </a>
                </div>

            </div>

        </div>

    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function (e) {
            e.preventDefault();
            window.location.href = "login.html";
        });
    </script>

</body>

</html>
