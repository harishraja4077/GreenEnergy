<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Oops! The page you're looking for doesn't exist. Return to GreenVolt and continue exploring sustainable energy solutions.">

    <title>404 - Page Not Found | GreenVolt</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/webp" href="images/green_logo.webp">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="error-page">

        <div class="error-panel">

            <!-- Floating Background Effects -->
            <div class="glow-orb orb-1"></div>
            <div class="glow-orb orb-2"></div>

            <!-- Header -->
            <div class="error-header">

                <a href="index.html" class="logo">
                    <img src="images/green_logo.webp" alt="GreenVolt Logo">
                </a>

            </div>

            <!-- Error Content -->
            <div class="text-center">

                <span class="section-tag">
                    Error 404
                </span>

                <h1 class="error-code reveal">
                    404
                </h1>

                <h2 class="error-message reveal">
                    Page Not Found
                </h2>

                <p class="error-description reveal">
                    The page you are looking for may have been removed,
                    renamed, or is temporarily unavailable.
                    Let's get you back on track.
                </p>

            </div>

          

            <!-- Action Buttons -->
            <div class="error-actions reveal">

                <a href="index.html" class="btn btn-primary">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Homepage
                </a>

                <a href="index.html#services" class="btn btn-secondary">
                    Explore Services
                </a>

            </div>

           

           

            <!-- Footer -->
            <div class="footer-bottom"
                style="margin-top:40px;justify-content:center;border-top:1px solid var(--glass-border);padding-top:20px;">

                <p>
                    © <span id="year"></span>
                    GreenVolt. All Rights Reserved.
                </p>

            </div>

        </div>

    </main>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();

        const revealElements =
            document.querySelectorAll(".reveal");

        revealElements.forEach((el, index) => {
            setTimeout(() => {
                el.classList.add("revealed");
            }, 150 * index);
        });
    </script>

</body>

</html>
